<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>黑流树海笔记 · 节点记录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-main: #0a0a0a;
            --bg-panel: #1a1a1a;
            --panel-border: #2a2a2a;
            --text-white: #f0f0f0;
            --text-gray: #a0a0a0;
            --empty-text: #5a5a5a;
            --title-text: #ffffff;
            --btn-left: #2a2a2a;
            --btn-left-hover: #3a4a6a;
            --btn-left-text: #e8e8e8;
            --btn-right: #60a5fa;
            --btn-right-hover: #7bb8fc;
            --btn-right-text: #ffffff;
            --reset-bg: #8a1a1a;
            --reset-hover: #aa2a2a;
            --reset-fg: #f0f0f0;
            --mode-btn-bg: #1a1a1a;
            --mode-btn-fg: #a0a0a0;
            --count-text: #6a9af4;
            --divider-color: #4a4a4a;
            --side-title-color: #ffffff;
        }

        [data-theme="light"] {
            --bg-main: #f0f2f5;
            --bg-panel: #ffffff;
            --panel-border: #d0d5dd;
            --text-white: #1a1a2e;
            --text-gray: #6a6a7a;
            --empty-text: #b0b0b8;
            --title-text: #1a1a2e;
            --btn-left: #e8ecf1;
            --btn-left-hover: #d0d8e6;
            --btn-left-text: #1a1a2e;
            --btn-right: #60a5fa;
            --btn-right-hover: #7bb8fc;
            --btn-right-text: #ffffff;
            --reset-bg: #dc2626;
            --reset-hover: #ef4444;
            --reset-fg: #ffffff;
            --mode-btn-bg: #e8ecf1;
            --mode-btn-fg: #6a6a7a;
            --count-text: #2563eb;
            --divider-color: #000000;
            --side-title-color: #1a1a2e;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-white);
            min-height: 100vh;
            transition: background 0.3s ease 0.4s, color 0.3s;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 左侧竖排装饰 ===== */
        .side-title {
            position: fixed;
            left: -30px;
            top: 47%;
            transform: translateY(-50%) rotate(180deg);
            writing-mode: vertical-rl;
            text-orientation: sideways;
            font-family: "Arial Black", "Impact", "Microsoft YaHei", sans-serif;
            font-size: 110px;
            font-weight: 900;
            letter-spacing: 6px;
            color: var(--side-title-color);
            pointer-events: none;
            user-select: none;
            z-index: 0;
            opacity: 0.12;
            transition: color 0.3s ease 0.4s;
            white-space: nowrap;
        }

        /* ===== 右侧竖排装饰 ===== */
        .side-title-right {
            position: fixed;
            right: -30px;
            top: 25%; 
            transform: translateY(-50%) rotate(180deg);
            writing-mode: vertical-rl;
            text-orientation: sideways;
            font-family: "Arial Black", "Impact", "Microsoft YaHei", sans-serif;
            font-size: 110px;
            font-weight: 900;
            letter-spacing: 6px;
            color: var(--side-title-color);
            pointer-events: none;
            user-select: none;
            z-index: 0;
            opacity: 0.12;    
            transition: color 0.3s ease 0.4s;
            white-space: nowrap;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 20px 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            padding: 12px 0 6px;
            position: relative;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--title-text);
            transition: color 0.3s;
            letter-spacing: 2px;
        }

        .header-sub {
            font-size: 14px;
            color: var(--text-gray);
            margin-top: 4px;
            transition: color 0.3s;
            letter-spacing: 1px;
        }

        .mode-toggle {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: var(--mode-btn-bg);
            color: var(--mode-btn-fg);
            border: none;
            border-radius: 6px;
            font-size: 20px;
            width: 42px;
            height: 42px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mode-toggle:hover {
            background: var(--btn-left-hover);
            color: var(--text-white);
        }

        .main {
            flex: 1;
            display: flex;
            gap: 0;
            margin-top: 12px;
            min-height: 0;
            align-items: stretch;
        }

        .panel {
            flex: 1;
            background: var(--bg-panel);
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s, border-color 0.3s;
            min-width: 0;
            position: relative;
        }

        .panel:first-child {
            border-radius: 8px 0 0 8px;
            border-right: none;
        }

        .panel:last-child {
            border-radius: 0 8px 8px 0;
            border-left: none;
        }

        .divider {
            flex: 0 0 20px;
            background: var(--divider-color);
            transition: background 0.3s;
            align-self: stretch;
            border-radius: 0;
        }

        .panel-header {
            padding: 12px 16px 8px;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-white);
            transition: color 0.3s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-header .count {
            font-size: 15px;
            font-weight: 700;
            color: var(--count-text);
            transition: color 0.3s;
        }

        .panel-body {
            flex: 1;
            padding: 8px 12px 16px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 8px;
        }

        .empty-hint {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--empty-text);
            font-size: 17px;
            transition: color 0.3s;
            min-height: 120px;
        }

        .node-btn {
            padding: 10px 8px;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
            text-align: center;
            min-width: 0;
            flex: 0 0 calc(25% - 8px);
            max-width: calc(25% - 8px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: inherit;
        }

        .node-btn:active {
            transform: scale(0.96);
        }

        .node-left {
            background: var(--btn-left);
            color: var(--btn-left-text);
            border-color: var(--panel-border);
        }

        .node-left:hover {
            background: var(--btn-left-hover);
        }

        .node-right {
            background: var(--btn-right);
            color: var(--btn-right-text);
            border-color: var(--btn-right);
        }

        .node-right:hover {
            background: var(--btn-right-hover);
            border-color: var(--btn-right-hover);
        }

        .footer {
            flex-shrink: 0;
            text-align: center;
            padding: 12px 0 4px;
        }

        .reset-btn {
            background: var(--reset-bg);
            color: var(--reset-fg);
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: 700;
            padding: 12px 42px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
            font-family: inherit;
        }

        .reset-btn:hover {
            background: var(--reset-hover);
        }

        .reset-btn:active {
            transform: scale(0.97);
        }

        .status-bar {
            font-size: 14px;
            color: var(--text-gray);
            margin-top: 6px;
            transition: color 0.3s;
            min-height: 20px;
        }

        .status-bar.done {
            color: var(--title-text);
            font-weight: 700;
        }

        @media (max-width: 700px) {
            .side-title {
                font-size: 60px;
                left: -20px;
                opacity: 0.08;
            }

            .side-title-right {
                font-size: 60px;
                right: -20px;
                opacity: 0.08;
            }

            .main {
                flex-direction: column;
                gap: 10px;
            }

            .divider {
                display: none;
            }

            .panel:first-child {
                border-radius: 8px 8px 0 0;
                border-right: 1px solid var(--panel-border);
                border-bottom: none;
            }

            .panel:last-child {
                border-radius: 0 0 8px 8px;
                border-left: 1px solid var(--panel-border);
                border-top: none;
            }

            [data-theme="light"] .panel:first-child,
            [data-theme="light"] .panel:last-child {
                border: 1px solid var(--panel-border);
            }

            .node-btn {
                flex: 0 0 calc(33.33% - 8px);
                max-width: calc(33.33% - 8px);
                font-size: 14px;
                padding: 8px 6px;
            }

            .header-title {
                font-size: 20px;
            }

            .mode-toggle {
                font-size: 18px;
                width: 38px;
                height: 38px;
            }

            .container {
                padding: 10px 12px 12px;
            }

            .panel-header {
                font-size: 16px;
                padding: 10px 12px 6px;
            }
        }

        @media (max-width: 480px) {
            .side-title {
                font-size: 40px;
                left: -15px;
                opacity: 0.06;
            }

            .side-title-right {
                font-size: 40px;
                right: -15px;
                opacity: 0.06;
            }

            .node-btn {
                flex: 0 0 calc(50% - 8px);
                max-width: calc(50% - 8px);
                font-size: 13px;
                padding: 6px 5px;
            }

            .header-title {
                font-size: 18px;
            }
        }

        .panel-body::-webkit-scrollbar {
            width: 4px;
        }
        .panel-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .panel-body::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 4px;
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .node-btn {
                flex: 0 0 calc(33.33% - 8px);
                max-width: calc(33.33% - 8px);
                font-size: 13px;
                padding: 6px 4px;
            }
        }

        .theme-ripple {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(0);
            transform-origin: center center;
        }
    </style>
</head>
<body>

    <!-- 左侧竖排装饰 -->
    <div class="side-title">BLACK FLOW</div>

    <!-- 右侧竖排装饰 -->
    <div class="side-title-right">NOTES</div>

    <div class="container" id="app">

        <div class="header">
            <div class="header-title">◆ 黑流树海笔记 · 节点记录 ◆</div>
            <div class="header-sub">← 点击左侧选择探索 · 点击右侧撤销选择 →</div>
            <button class="mode-toggle" id="modeToggle" title="切换日间/夜间模式">☀</button>
        </div>

        <div class="main">
            <div class="panel">
                <div class="panel-header">
                    <span>◈ 未探索</span>
                </div>
                <div class="panel-body" id="leftContainer"></div>
            </div>

            <div class="divider"></div>

            <div class="panel">
                <div class="panel-header">
                    <span>◈ 已探索</span>
                    <span class="count" id="countLabel">0 / 22</span>
                </div>
                <div class="panel-body" id="rightContainer"></div>
            </div>
        </div>

        <div class="footer">
            <button class="reset-btn" id="resetBtn">↻ 重新作战</button>
            <div class="status-bar" id="statusBar"></div>
        </div>

    </div>

    <script>
        const NODES = [
            "作战","紧急作战","绿商店", "黄商店","林间空地",
            "不期而遇","得偿所愿","先行一步","失与得", "安全的角落", 
            "羽瞰点","狭路相逢", "应急助力","居民据点",
            "误入奇境",  "曲折密道", "未知的诡秘","未知的凶戾",
            "险路尽头", "险路小径", "险路恶敌", "命运所指"
        ];

        const STORAGE_KEY = 'blackflow_nodes';

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.leftNodes && data.rightNodes) {
                        return data;
                    }
                }
            } catch (e) {}
            return { leftNodes: [...NODES], rightNodes: [] };
        }

        function saveData(leftNodes, rightNodes) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ leftNodes, rightNodes }));
            } catch (e) {}
        }

        let data = loadData();
        let leftNodes = data.leftNodes;
        let rightNodes = data.rightNodes;
        let theme = 'dark';

        const leftContainer = document.getElementById('leftContainer');
        const rightContainer = document.getElementById('rightContainer');
        const countLabel = document.getElementById('countLabel');
        const statusBar = document.getElementById('statusBar');
        const resetBtn = document.getElementById('resetBtn');
        const modeToggle = document.getElementById('modeToggle');

        try {
            const savedTheme = localStorage.getItem('blackflow_theme');
            if (savedTheme === 'light') {
                theme = 'light';
                document.documentElement.setAttribute('data-theme', 'light');
                modeToggle.textContent = '🌙';
            }
        } catch (e) {}

        function render() {
            leftContainer.innerHTML = '';
            rightContainer.innerHTML = '';

            if (leftNodes.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-hint';
                empty.textContent = '✓ 全部已探索';
                leftContainer.appendChild(empty);
            } else {
                leftNodes.forEach(name => {
                    const btn = document.createElement('button');
                    btn.className = 'node-btn node-left';
                    btn.textContent = name;
                    btn.dataset.name = name;
                    btn.addEventListener('click', () => moveToRight(name));
                    leftContainer.appendChild(btn);
                });
            }

            if (rightNodes.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-hint';
                empty.textContent = '尚未探索任何节点';
                rightContainer.appendChild(empty);
            } else {
                rightNodes.forEach(name => {
                    const btn = document.createElement('button');
                    btn.className = 'node-btn node-right';
                    btn.textContent = name;
                    btn.dataset.name = name;
                    btn.addEventListener('click', () => moveToLeft(name));
                    rightContainer.appendChild(btn);
                });
            }

            const total = NODES.length;
            const done = rightNodes.length;
            countLabel.textContent = `${done} / ${total}`;

            if (done === total) {
                statusBar.textContent = '✦ 全部探索完成 ✦';
                statusBar.className = 'status-bar done';
            } else {
                statusBar.textContent = '';
                statusBar.className = 'status-bar';
            }

            saveData(leftNodes, rightNodes);
        }

        function moveToRight(name) {
            const idx = leftNodes.indexOf(name);
            if (idx !== -1) {
                leftNodes.splice(idx, 1);
                rightNodes.push(name);
                render();
            }
        }

        function moveToLeft(name) {
            const idx = rightNodes.indexOf(name);
            if (idx !== -1) {
                rightNodes.splice(idx, 1);
                leftNodes.push(name);
                render();
            }
        }

        function resetAll() {
            leftNodes = [...NODES];
            rightNodes = [];
            render();
        }

        function toggleTheme() {
            const nextTheme = theme === 'dark' ? 'light' : 'dark';

            let firstColor, secondColor;
            if (nextTheme === 'light') {
                firstColor = '#0096ff';
                secondColor = '#f0f2f5';
            } else {
                firstColor = '#2ecc40';
                secondColor = '#0a0a0a';
            }

            const rect = modeToggle.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            const maxR = Math.hypot(
                Math.max(cx, window.innerWidth - cx),
                Math.max(cy, window.innerHeight - cy)
            );

            function createRipple(color, delay, zIndex) {
                const ripple = document.createElement('div');
                ripple.className = 'theme-ripple';
                ripple.style.width = maxR * 2 + 'px';
                ripple.style.height = maxR * 2 + 'px';
                ripple.style.left = (cx - maxR) + 'px';
                ripple.style.top = (cy - maxR) + 'px';
                ripple.style.background = color;
                ripple.style.zIndex = zIndex;
                document.body.appendChild(ripple);

                setTimeout(() => {
                    requestAnimationFrame(() => {
                        ripple.style.transform = 'scale(1)';
                    });
                }, delay);

                setTimeout(() => {
                    ripple.remove();
                }, delay + 700);
            }

            createRipple(firstColor, 0, -2);
            createRipple(secondColor, 120, -1);

            theme = nextTheme;
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                modeToggle.textContent = '🌙';
            } else {
                document.documentElement.removeAttribute('data-theme');
                modeToggle.textContent = '☀';
            }
            try {
                localStorage.setItem('blackflow_theme', theme);
            } catch (e) {}
        }

        resetBtn.addEventListener('click', resetAll);
        modeToggle.addEventListener('click', toggleTheme);

        render();
    </script>

</body>
</html>
